<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공부할 시간</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root{color-scheme:light}
  html,body{background:#fff;color:#18181b;height:100%}
  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;margin:0}
  .bg-fade{transition:background-color .8s ease}
  @keyframes pulseRing{0%{transform:scale(.92);opacity:.55}50%{transform:scale(1.04);opacity:.12}100%{transform:scale(.92);opacity:.55}}
  .pulse-ring{animation:pulseRing 3.6s ease-in-out infinite}
  @keyframes floaty{0%{transform:translate(0,0)}50%{transform:translate(14px,-18px)}100%{transform:translate(0,0)}}
  .floaty{animation:floaty 9s ease-in-out infinite}
  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .wave{animation:wave 12s linear infinite}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .shake{animation:shake .5s ease-in-out}
  @keyframes flash{0%,100%{background:rgba(220,38,38,.93)}50%{background:rgba(153,27,27,.96)}}
  .flash{animation:flash 1.4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
  .twinkle{animation:twinkle 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .wiggle{animation:wiggle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes bounceSoft{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .bounce-soft{animation:bounceSoft 3s ease-in-out infinite}
  button,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .app-h{min-height:100vh;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .scroll-y{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .tnum{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;
const PRESETS=[
 {key:'warm',icon:'🌱',tint:'#dcfce7',name:'몸풀기',desc:'가볍게 시동 걸기',f:25,b:5},
 {key:'hard',icon:'🔥',tint:'#ffedd5',name:'빡공',desc:'제대로 파고들기',f:50,b:10},
 {key:'cram',icon:'⚡',tint:'#fef9c3',name:'벼락치기',desc:'내일이 시험이다',f:90,b:15},
];
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function beep(kind){
  try{
    const C=window.AudioContext||window.webkitAudioContext; const ctx=new C();
    const seq = kind==='fail'?[[220,0],[165,.18]]:[[660,0],[880,.16],[1320,.32]];
    seq.forEach(([f,t])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.type='sine';
      g.gain.setValueAtTime(.0001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,ctx.currentTime+t+.03);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.5);o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.55);});
  }catch(e){}
}

function defaultExam(){const t=new Date();let y=t.getFullYear();if(t>new Date(y,9,1,23,59,59))y+=1;return {name:'중간고사',date:y+'-10-01'};}
const DEFAULTS={score:90,streak:0,coupons:0,done:0,sel:'hard',cf:40,cb:8,stats:{days:{},best:0},exam:defaultExam(),subjects:[],lastSub:''};
const DARK_IN='rounded-lg border border-zinc-400 bg-zinc-500 px-3 py-2 text-base font-semibold text-white placeholder:text-zinc-200 outline-none focus:border-white focus:ring-2 focus:ring-zinc-300 [color-scheme:dark]';
const canStore=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
const store={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};
function makeSalt(){
  try{const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');}
  catch(e){return String(Math.random()).slice(2)+Date.now();}
}
async function hashPw(salt,pw){
  const txt=salt+':'+pw;
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){let h=5381;for(let i=0;i<txt.length;i++){h=((h<<5)+h+txt.charCodeAt(i))|0;}return 'f'+h;}
}
function loadUser(id){
  const d={...DEFAULTS,...(store.get('gst:data:'+id)||{})};
  if(d.exam==null)d.exam=defaultExam();
  let notice=null;
  if(store.get('gst:active:'+id)){
    d.score=Math.max(0,d.score-10);d.streak=0;
    store.del('gst:active:'+id);store.set('gst:data:'+id,d);
    notice='지난 집중 도중 앱을 떠났습니다. 예상 점수 −10, 연속 기록 0';
  }
  return {user:id,data:d,notice};
}
function bootLoad(){
  const id=store.get('gst:session');
  const users=store.get('gst:users')||{};
  if(id&&users[id])return loadUser(id);
  return {user:null,data:DEFAULTS,notice:null};
}

const NOSUB='미지정';
const WD=['일','월','화','수','목','금','토'];
const PAL=['#93c5fd','#f9a8d4','#fcd34d','#86efac','#c4b5fd','#fdba74','#67e8f9','#fca5a5'];
const pad2=n=>String(n).padStart(2,'0');
const dayKey=(ts)=>{const d=new Date(ts);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};
const emptyDay=()=>({ms:0,done:0,fail:0,subj:{}});
const addTime=(st,name,ms,ts)=>{const k=dayKey(ts);const d=st.days[k]||emptyDay();
  const subj=(name&&name!==NOSUB)?{...d.subj,[name]:(d.subj[name]||0)+ms}:d.subj;
  return {...st,days:{...st.days,[k]:{...d,ms:d.ms+ms,subj}}};};
const bumpDay=(st,f,ts)=>{const k=dayKey(ts);const d=st.days[k]||emptyDay();
  return {...st,days:{...st.days,[k]:{...d,[f]:(d[f]||0)+1}}};};
const dday=(date,off=0)=>{const [y,m,d]=date.split('-').map(Number);const t=new Date();t.setDate(t.getDate()+off);
  return Math.round((new Date(y,m-1,d)-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/86400000);};
const ddLabel=(n)=>n===0?'D-DAY':n>0?'D-'+n:'D+'+(-n);
function fmtDur(ms){const t=Math.round(ms/1000);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;
  if(h>0)return h+'시간 '+pad2(m)+'분';if(m>0)return m+'분 '+pad2(sec)+'초';return sec+'초';}
const toB64=(str)=>{const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>{bin+=String.fromCharCode(b);});return btoa(bin);};
const fromB64=(b)=>{const bin=atob(b);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));};
const chk=(str)=>{let h=5381;for(let i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))|0;}return (h>>>0).toString(36);};

function Stat({label,value,span}){
  return(<div className={'rounded-2xl bg-zinc-50 px-4 py-3 '+(span?'col-span-2':'')}>
    <p className="text-[11px] text-zinc-400">{label}</p>
    <p className="mt-0.5 text-xl font-black tnum">{value}</p>
  </div>);
}
function StatsView({stats,user,onBackup,off=0}){
  const [range,setRange]=useState('week');
  const now=Date.now()+off*86400000;
  const todayK=dayKey(now);
  const wk=new Date(now);wk.setDate(wk.getDate()-6);const weekK=dayKey(wk.getTime());
  const inRange=(k)=>range==='all'?true:range==='today'?k===todayK:k>=weekK;
  let ms=0,done=0,fail=0;const subj={};
  Object.keys(stats.days||{}).forEach(k=>{
    if(!inRange(k))return;const d=stats.days[k];
    ms+=d.ms||0;done+=d.done||0;fail+=d.fail||0;
    Object.entries(d.subj||{}).forEach(([n,v])=>{if(n===NOSUB)return;subj[n]=(subj[n]||0)+v;});
  });
  const rows=Object.entries(subj).sort((a,b)=>b[1]-a[1]);
  const maxS=rows.length?rows[0][1]:1;
  const week=[];
  for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const k=dayKey(d.getTime());
    week.push({k,wd:WD[d.getDay()],ms:(stats.days[k]||{}).ms||0,today:i===0});}
  const maxW=Math.max(1,...week.map(w=>w.ms));
  const rate=(done+fail)>0?Math.round(done/(done+fail)*100)+'%':'-';
  return(
  <div className="mt-2 space-y-4">
    <div className="flex rounded-xl bg-zinc-100 p-1">
      {[['today','오늘'],['week','최근 7일'],['all','전체']].map(([k,l])=>(
        <button key={k} onClick={()=>setRange(k)} className={'flex-1 rounded-lg py-2 text-xs font-bold transition '+(range===k?'bg-white text-zinc-900 shadow-sm':'text-zinc-400')}>{l}</button>
      ))}
    </div>
    <div className="grid grid-cols-2 gap-3">
      <Stat span label="총 공부시간" value={fmtDur(ms)}/>
      <Stat label="루틴 완수" value={done+'회'}/>
      <Stat label="실패(딴짓·포기)" value={fail+'회'}/>
      <Stat label="완수율" value={rate}/>
      <Stat label="역대 최고 연속" value={(stats.best||0)+'회'}/>
    </div>
    <div className="rounded-2xl border border-zinc-200 p-4">
      <p className="text-sm font-bold text-zinc-800">과목별 공부시간</p>
      {rows.length===0&&<p className="mt-3 text-xs text-zinc-400">아직 기록이 없어요. 루틴을 시작하고 과목을 적어 보세요.</p>}
      {rows.map(([n,v],i)=>(
        <div key={n} className="mt-3">
          <div className="flex items-baseline justify-between text-xs">
            <span className="font-bold text-zinc-700">{n}</span>
            <span className="tnum text-zinc-500">{fmtDur(v)} · {ms>0?Math.round(v/ms*100):0}%</span>
          </div>
          <div className="mt-1 h-2.5 overflow-hidden rounded-full bg-zinc-100">
            <div className="h-full rounded-full" style={{width:(v/maxS*100)+'%',background:PAL[i%PAL.length]}}></div>
          </div>
        </div>
      ))}
      {rows.length>0&&ms-rows.reduce((a,r)=>a+r[1],0)>1000&&<p className="mt-3 text-[11px] text-zinc-400">과목 없이 공부한 {fmtDur(ms-rows.reduce((a,r)=>a+r[1],0))}는 총 공부시간에만 포함돼요.</p>}
    </div>
    <div className="rounded-2xl border border-zinc-200 p-4">
      <p className="text-sm font-bold text-zinc-800">최근 7일 <span className="text-[11px] font-normal text-zinc-400">(단위: 분)</span></p>
      <div className="mt-3 flex h-32 items-end justify-between gap-2">
        {week.map(w=>(
          <div key={w.k} className="flex flex-1 flex-col items-center justify-end">
            <span className="mb-1 text-[10px] text-zinc-400 tnum">{w.ms>0?(w.ms<60000?'<1':Math.floor(w.ms/60000)):''}</span>
            <div className="w-full rounded-md" style={{height:Math.max(w.ms>0?4:2,Math.round(w.ms/maxW*80))+'px',background:w.today?'#18181b':'#d4d4d8'}}></div>
            <span className={'mt-1 text-[11px] '+(w.today?'font-bold text-zinc-900':'text-zinc-400')}>{w.wd}</span>
          </div>
        ))}
      </div>
    </div>
    <button onClick={onBackup} className="w-full rounded-xl border border-zinc-200 py-3 text-sm font-semibold text-zinc-600 hover:border-zinc-400">📦 기기 이동 · 백업 코드</button>
    {!user&&<p className="text-center text-[11px] text-zinc-400">게스트 기록은 저장되지 않아요. 로그인하면 계속 쌓입니다.</p>}
  </div>);
}

function Hero({cls='h-28'}){
  return(
  <svg viewBox="0 0 320 130" className={'mx-auto w-auto '+cls} aria-hidden="true">
    <ellipse cx="160" cy="122" rx="135" ry="6" fill="#f4f4f5"/>
    <rect x="66" y="94" width="112" height="24" rx="6" fill="#bfdbfe"/>
    <rect x="76" y="101" width="92" height="4" rx="2" fill="#93c5fd"/>

    <rect x="72" y="48" width="102" height="22" rx="6" fill="#fde68a"/>
    <rect x="82" y="54" width="82" height="4" rx="2" fill="#fcd34d"/>
    <rect x="96" y="38" width="66" height="9" rx="2" fill="#fdba74"/>
    <polygon points="162,38 162,47 174,42.5" fill="#fde68a"/>

    <g className="wiggle">
      <circle cx="216" cy="46" r="9" fill="#fca5a5" stroke="#18181b" strokeWidth="2.5"/>

      <line x1="222" y1="106" x2="216" y2="118" stroke="#18181b" strokeWidth="3" strokeLinecap="round"/>
      <line x1="258" y1="106" x2="264" y2="118" stroke="#18181b" strokeWidth="3" strokeLinecap="round"/>

      <line x1="240" y1="49" x2="240" y2="54" stroke="#d4d4d8" strokeWidth="2.5" strokeLinecap="round"/>
      <line x1="211" y1="78" x2="216" y2="78" stroke="#d4d4d8" strokeWidth="2.5" strokeLinecap="round"/>
      <line x1="264" y1="78" x2="269" y2="78" stroke="#d4d4d8" strokeWidth="2.5" strokeLinecap="round"/>
      <circle cx="231" cy="75" r="2.6" fill="#18181b"/>
      <circle cx="249" cy="75" r="2.6" fill="#18181b"/>

      <circle cx="254" cy="84" r="4" fill="#fbcfe8"/>
      <path d="M235 84 Q240 90 245 84" fill="none" stroke="#18181b" strokeWidth="2.2" strokeLinecap="round"/>
    </g>
    <text x="34" y="44" fontSize="18" fill="#fcd34d" className="twinkle">✦</text>
    <text x="196" y="24" fontSize="13" fill="#93c5fd" className="twinkle" style={{animationDelay:'-1s'}}>✦</text>
    <text x="292" y="30" fontSize="16" fill="#f9a8d4" className="twinkle" style={{animationDelay:'-1.8s'}}>✦</text>
    <text x="40" y="96" fontSize="12" fill="#86efac" className="twinkle" style={{animationDelay:'-.6s'}}>✦</text>
  </svg>);
}

function App(){
  const boot=useRef(null); if(!boot.current)boot.current=bootLoad(); const B=boot.current;
  const [screen,setScreen]=useState(B.user?'setup':'auth');
  const [sel,setSel]=useState(B.data.sel);
  const [cf,setCf]=useState(B.data.cf), [cb,setCb]=useState(B.data.cb);
  const [plan,setPlan]=useState({name:'빡공',f:50,b:10});
  const [phase,setPhase]=useState('focus');
  const [left,setLeft]=useState(0);
  const [total,setTotal]=useState(1);
  const [running,setRunning]=useState(false);
  const [score,setScore]=useState(B.data.score);
  const [streak,setStreak]=useState(B.data.streak);
  const [coupons,setCoupons]=useState(B.data.coupons);
  const [done,setDone]=useState(B.data.done);
  const [fail,setFail]=useState(false);
  const [toast,setToast]=useState(null);
  const [runSec,setRunSec]=useState(0);
  const [grace,setGrace]=useState(false);
  const [devOpen,setDevOpen]=useState(false);
  const [devOk,setDevOk]=useState(false);
  const [devCode,setDevCode]=useState('');
  const phaseRef=useRef(phase), runRef=useRef(running), failRef=useRef(fail);
  const graceT=useRef(null), hiddenAt=useRef(0);
  phaseRef.current=phase; runRef.current=running; failRef.current=fail;
  const [user,setUser]=useState(B.user);
  const [notice,setNotice]=useState(B.notice);
  const [mode,setMode]=useState('login');
  const [aid,setAid]=useState(''), [apw,setApw]=useState(''), [apw2,setApw2]=useState('');
  const [aerr,setAerr]=useState(''), [abusy,setAbusy]=useState(false);
  const userRef=useRef(user), runSecRef=useRef(0);
  userRef.current=user; runSecRef.current=runSec;
  const mark=(on)=>{const u=userRef.current;if(!u)return;if(on)store.set('gst:active:'+u,{t:Date.now()});else store.del('gst:active:'+u);};
  const [stats,setStats]=useState(B.data.stats);
  const [exam,setExam]=useState(B.data.exam);
  const [subjects,setSubjects]=useState(B.data.subjects||[]);
  const [subject,setSubject]=useState(B.data.lastSub||'');
  const [newSub,setNewSub]=useState('');
  const [tab,setTab]=useState('home');
  const [examEdit,setExamEdit]=useState(false);
  const [exName,setExName]=useState(''), [exDate,setExDate]=useState('');
  const [sheet,setSheet]=useState(false);
  const [bkCode,setBkCode]=useState(''), [bkIn,setBkIn]=useState(''), [bkErr,setBkErr]=useState('');
  const [bkAsk,setBkAsk]=useState(false), [bkCopied,setBkCopied]=useState(false);
  const [dateOff,setDateOff]=useState(0), [showRestore,setShowRestore]=useState(false);
  const subjRef=useRef(B.data.lastSub||''), segStartRef=useRef(0), liveRef=useRef({}), pendingRef=useRef(false);
  // 제작자 모드의 날짜 조절: 기록이 쌓이는 '오늘'도 같이 움직인다
  const offRef=useRef(0); offRef.current=dateOff;
  const vTs=(ts)=>ts+offRef.current*86400000;
  // 과목 구간 측정: 열린 구간 하나만 존재. 과목 전환/이탈/종료 시점에 정확한 ms로 닫아서 합산한다.
  const openSeg=(ts)=>{if(!segStartRef.current)segStartRef.current=ts;};
  const closeSeg=(ts)=>{
    const st=segStartRef.current; if(!st)return;
    segStartRef.current=0;
    const ms=Math.max(0,ts-st); if(ms<=0)return;
    const nm=subjRef.current||NOSUB;
    liveRef.current[nm]=(liveRef.current[nm]||0)+ms;
    setStats(x=>addTime(x,nm,ms,vTs(ts)));
  };
  const liveNow=()=>{const o={...liveRef.current};
    if(segStartRef.current){const k=subjRef.current||NOSUB;o[k]=(o[k]||0)+Math.max(0,Date.now()-segStartRef.current);}
    return o;};

  const showToast=(t)=>{setToast(t);setTimeout(()=>setToast(null),2600);};

  const failRoutine=useCallback(()=>{
    if(!runRef.current)return; runRef.current=false;
    const fnow=Date.now(); closeSeg(fnow);
    setStats(x=>bumpDay(x,'fail',vTs(fnow)));
    setRunning(false);setFail(true);mark(false);
    setScore(s=>Math.max(0,s-10));setStreak(0);beep('fail');
  },[]);

  useEffect(()=>{
    const h=()=>{
      const armed = phaseRef.current==='focus'&&runRef.current&&!failRef.current;
      if(document.visibilityState==='hidden'){
        if(!armed)return;
        if(graceT.current)return;
        hiddenAt.current=Date.now();
        closeSeg(hiddenAt.current);
        graceT.current=setTimeout(()=>{graceT.current=null;failRoutine();},3000);
      }else{
        if(pendingRef.current){
          pendingRef.current=false;liveRef.current={};openSeg(Date.now());mark(true);
          setRunSec(0);setRunning(true);showToast('휴식이 끝났어요. 집중 시작!');return;
        }
        const away=hiddenAt.current?Date.now()-hiddenAt.current:0;
        if(graceT.current){clearTimeout(graceT.current);graceT.current=null;}
        hiddenAt.current=0;
        if(!armed)return;
        if(away>3000){failRoutine();}
        else if(away>0){openSeg(Date.now());setGrace(true);setTimeout(()=>setGrace(false),2800);}
      }
    };
    const onHide=(e)=>{if(!e.persisted&&phaseRef.current==='focus'&&runSecRef.current<30)mark(false);};
    document.addEventListener('visibilitychange',h);
    window.addEventListener('pagehide',h);
    window.addEventListener('pagehide',onHide);

    <div className="app-h scroll-y relative flex flex-col items-center bg-white px-5 py-4">
      <span className="floaty pointer-events-none absolute left-3 top-10 text-2xl opacity-60">☁️</span>
      <span className="floaty pointer-events-none absolute right-4 top-16 text-2xl opacity-60" style={{animationDelay:'-4s'}}>✏️</span>
      <div className="relative z-10 w-full max-w-sm">
        <Hero cls="h-20"/>
        <p className="mt-4 text-center text-xs tracking-[.3em] text-zinc-400">STUDY OR DIE</p>
        <h1 className="mt-2 text-center text-4xl font-black tracking-tight">공부할 시간</h1>
        <p className="mt-2 text-center text-sm text-zinc-500">아이디로 기록을 저장하고 언제든 이어서 하세요.</p>
        <div className="mt-4 flex rounded-xl bg-zinc-100 p-1">
          {[['login','로그인'],['signup','회원가입']].map(([k,l])=>(
            <button key={k} onClick={()=>{setMode(k);setAerr('');}}
              className={`flex-1 rounded-lg py-2 text-sm font-bold transition ${mode===k?'bg-white text-zinc-900 shadow-sm':'text-zinc-400'}`}>{l}</button>
          ))}
        </div>
        <div className="mt-4 space-y-3">
          <label className="block text-xs font-semibold text-zinc-500">아이디
            <input value={aid} onChange={e=>setAid(e.target.value)} onKeyDown={enterKey} type="text" autoComplete="username" autoCapitalize="none" autoCorrect="off" spellCheck="false" className={inp}/>
          </label>
          <label className="block text-xs font-semibold text-zinc-500">비밀번호
            <input value={apw} onChange={e=>setApw(e.target.value)} onKeyDown={enterKey} type="password" autoComplete={mode==='signup'?'new-password':'current-password'} className={inp}/>
          </label>
          {mode==='signup'&&(
            <label className="block text-xs font-semibold text-zinc-500">비밀번호 확인
              <input value={apw2} onChange={e=>setApw2(e.target.value)} onKeyDown={enterKey} type="password" autoComplete="new-password" className={inp}/>
            </label>
          )}
        </div>
        {aerr&&<p className="mt-3 rounded-lg bg-red-50 px-3 py-2 text-xs font-semibold text-red-600">{aerr}</p>}
        {!canStore&&<p className="mt-3 rounded-lg bg-amber-50 px-3 py-2 text-xs font-semibold text-amber-700">이 브라우저는 저장을 막고 있어요. 게스트로만 이용할 수 있습니다.</p>}
        <button onClick={submitAuth} disabled={abusy} className="mt-4 w-full rounded-xl bg-zinc-900 py-3.5 text-base font-bold text-white transition hover:bg-black active:scale-[.99] disabled:opacity-60">{mode==='signup'?'가입하고 시작하기':'로그인'}</button>
        <button onClick={guest} className="mt-2 w-full py-2 text-sm font-semibold text-zinc-400 hover:text-zinc-700">로그인 없이 체험하기</button>
        {showRestore?(
          <button onClick={()=>setSheet(true)} className="w-full py-2 text-sm font-semibold text-zinc-400 underline decoration-zinc-300 underline-offset-4 hover:text-zinc-700">📦 백업 코드 붙여넣고 이어하기</button>
        ):(
          <button onClick={()=>setShowRestore(true)} className="w-full py-2 text-sm font-semibold text-zinc-400 hover:text-zinc-700">쓰던 기기에서 넘어오셨나요?</button>
        )}
        <p className="mt-3 text-center text-[11px] leading-relaxed text-zinc-400">기록은 이 기기의 브라우저에만 저장돼요.<br/>다른 기기로는 백업 코드로 옮길 수 있어요.</p>
      </div>
      {sheetEl}{toastEl}
    </div>);
  }

  if(screen==='setup'){
    const tile=(on)=>'flex items-center gap-2 rounded-xl border px-2.5 py-2 text-left transition '+(on?'border-zinc-900 bg-zinc-900 text-white':'border-zinc-200 hover:border-zinc-400');
    return(
    <div className="app-h relative flex flex-col overflow-x-hidden overflow-y-auto bg-white px-4 pb-14 pt-2">
      <span className="floaty pointer-events-none absolute right-8 top-16 text-xl opacity-40">☁️</span>
      <div className="relative z-10 mx-auto flex w-full min-h-0 max-w-lg flex-1 flex-col">
        <div className="flex items-center justify-between gap-2">
          {tab==='home'?<span/>:<span className="shrink-0 text-base font-black tracking-tight">⏱️ 공부할 시간</span>}
          <div className="flex min-w-0 items-center gap-3 text-xs">
            {user?(<>
              <span className="max-w-[6rem] truncate font-semibold text-zinc-500">👤 {user}</span>
              <button onClick={()=>setSheet(true)} aria-label="백업" className="text-base">📦</button>
              <button onClick={logout} className="shrink-0 font-semibold text-zinc-400">로그아웃</button>
            </>):(<>
              <span className="text-zinc-400">게스트 · 저장 안 됨</span>
              <button onClick={()=>setScreen('auth')} className="shrink-0 font-semibold text-zinc-700 underline">로그인</button>
            </>)}
          </div>
        </div>
        {notice&&<div onClick={()=>setNotice(null)} className="mt-2 rounded-xl bg-red-50 px-3 py-2 text-xs font-semibold leading-relaxed text-red-600">🚨 {notice}</div>}
        <div className="mt-2 flex rounded-xl bg-zinc-100 p-1">
          {[['home','🏠 홈'],['stats','📊 통계']].map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)} className={'flex-1 rounded-lg py-1.5 text-sm font-bold transition '+(tab===k?'bg-white text-zinc-900 shadow-sm':'text-zinc-400')}>{l}</button>
          ))}
        </div>
        {tab==='stats'?(<div className="scroll-y mt-1 min-h-0 flex-1 pb-2"><StatsView stats={stats} user={user} onBackup={()=>setSheet(true)} off={dateOff}/></div>):(
        <div className="mt-3 flex min-h-0 flex-1 flex-col">
          <div className="grid grid-cols-2 gap-3">
            <div className="rounded-2xl border border-zinc-200 px-3 py-3 text-center">
              <p className="text-[11px] font-semibold text-zinc-400">당신의 예상 시험 점수</p>
              <p className="text-5xl font-black leading-tight tnum">{score}</p>
              <p className="text-[11px] text-zinc-500 tnum">🔥 연속 {streak} · 🎟️ {coupons} · ✅ {done}</p>
            </div>
            {ddayEl}
          </div>
          <p className="mb-2 mt-4 text-xs font-semibold text-zinc-500">루틴 선택</p>
          <div className="space-y-2">
            {PRESETS.map(p=>(
              <button key={p.key} onClick={()=>setSel(p.key)} className={tile(sel===p.key)+' w-full'}>
                <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-xl" style={{background:p.tint}}>{p.icon}</span>
                <span className="min-w-0 flex-1">
                  <span className="flex items-baseline justify-between gap-2"><span className="text-sm font-bold">{p.name}</span><span className={'shrink-0 text-[11px] tnum '+(sel===p.key?'text-zinc-300':'text-zinc-500')}>{p.f}분 집중 / {p.b}분 휴식</span></span>
                  <span className={'mt-0.5 block text-[11px] '+(sel===p.key?'text-zinc-400':'text-zinc-400')}>{p.desc}</span>
                </span>
              </button>
            ))}
            <button onClick={()=>setSel('custom')} className={tile(sel==='custom')+' w-full'}>
              <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-indigo-100 text-xl">🎨</span>
              <span className="min-w-0 flex-1">
                <span className="flex items-baseline justify-between gap-2"><span className="text-sm font-bold">내 맘대로</span><span className={'shrink-0 text-[11px] tnum '+(sel==='custom'?'text-zinc-300':'text-zinc-500')}>{cf||'?'}분 / {cb||'?'}분</span></span>
                <span className={'mt-0.5 block text-[11px] '+(sel==='custom'?'text-zinc-400':'text-zinc-400')}>집중/휴식 시간을 직접 정하기</span>
              </span>
            </button>
          </div>
          {sel==='custom'&&(
            <div className="mt-2 flex gap-2 rounded-xl bg-zinc-50 p-2.5">
              {[['집중(분)',cf,setCf,180],['휴식(분)',cb,setCb,60]].map(([l,v,set,max])=>(
                <label key={l} className="flex-1 text-[11px] text-zinc-500">{l}
                  <input type="number" min="1" max={max} value={v} onChange={e=>set(e.target.value)}
                    className="mt-1 w-full rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-base font-bold tnum text-zinc-900 outline-none focus:border-zinc-900"/>
                </label>
              ))}
            </div>
          )}
          <div className="mt-2 rounded-xl bg-zinc-50 p-2.5">
            <p className="mb-1.5 text-[11px] font-semibold text-zinc-500">오늘 공부할 과목 <span className="font-normal text-zinc-400">(선택)</span></p>
            {chipList.length>0&&(
              <div className="mb-1.5 flex items-center gap-1.5 overflow-x-auto pb-0.5">
                {chipList.map(n=>(
                  <button key={n} onClick={()=>switchSubject(subject===n?'':n)}
                    className={'min-h-[40px] shrink-0 rounded-full px-4 py-2 text-sm font-bold '+(subject===n?'bg-zinc-900 text-white':'border border-zinc-200 bg-white text-zinc-700')}>{n}</button>
                ))}
              </div>
            )}
            <div className="flex gap-2">
              <input value={newSub} onChange={e=>setNewSub(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addSubject();}} maxLength={12} placeholder="새 과목 (예: 수학)"
                className={'w-0 min-w-0 flex-1 '+DARK_IN}/>
              <button onClick={addSubject} className="shrink-0 rounded-lg bg-zinc-900 px-6 py-2 text-sm font-bold text-white">추가</button>
            </div>
          </div>
          <div className="mt-auto pt-4">
            <button onClick={start} className="w-full rounded-xl bg-zinc-900 py-3.5 text-base font-bold text-white transition hover:bg-black active:scale-[.99]">시작하기</button>
            <p className="mt-2 text-center text-[11px] text-zinc-400">시작하면 다른 탭으로 못 갑니다. 정말입니다.</p>
          </div>
        </div>)}
      </div>
      {devPanel}{sheetEl}{examSheetEl}{toastEl}
    </div>);
  }

  const inFocusRun=!isBreak&&running;
  return(
  <div className={`bg-fade app-h ${isBreak?'bg-[#eefaf7]':'bg-white'} relative overflow-hidden`}>
    {isBreak&&(<div className="pointer-events-none absolute inset-0">
      <div className="floaty absolute left-[8%] top-[14%] h-28 w-52 rounded-full bg-white/70 blur-xl"></div>
      <div className="floaty absolute right-[10%] top-[26%] h-24 w-44 rounded-full bg-sky-100/80 blur-xl" style={{animationDelay:'-3s'}}></div>
      <div className="absolute bottom-0 left-0 w-[200%] wave">
        <svg viewBox="0 0 1200 120" className="w-full" preserveAspectRatio="none"><path d="M0,60 C150,110 350,10 600,60 C850,110 1050,10 1200,60 L1200,120 L0,120 Z" fill="#d7f2ec"/></svg>
      </div>
    </div>)}

    <div className="app-h relative mx-auto flex max-w-lg flex-col items-center px-4 pb-14 pt-2">
      <div className="w-full text-center">
        <p className="text-[11px] font-semibold tracking-wide text-zinc-400">당신의 예상 시험 점수</p>
        <p className="text-4xl font-black leading-tight tnum text-zinc-900">{score}</p>
        <div className="mt-0.5 flex flex-wrap justify-center gap-x-3 text-[11px] text-zinc-500">
          <span>🔥 연속 {streak}회</span><span>🎟️ 쿠폰 {coupons}개</span><span>{plan.name} · {plan.f}/{plan.b}</span>{exam&&<span>📅 {ddLabel(dday(exam.date,dateOff))}</span>}
        </div>
      </div>

      <div className="relative my-auto flex aspect-square w-[min(290px,74vw)] max-w-[38vh] items-center justify-center py-1">
        {!isBreak&&<div className="pulse-ring absolute h-[88%] w-[88%] rounded-full bg-zinc-200"></div>}
        <svg className="absolute h-[94%] w-[94%] -rotate-90" viewBox="0 0 320 320">
          <circle cx="160" cy="160" r={R} fill="none" stroke={isBreak?'#c8ece4':'#f0f0f1'} strokeWidth="6"/>
          <circle cx="160" cy="160" r={R} fill="none" stroke={isBreak?'#34b39a':'#18181b'} strokeWidth="6"
            strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C*(1-pct)} style={{transition:rewind?'none':'stroke-dashoffset 1s linear'}}/>
        </svg>
        <div className="relative text-center">
          <p className={`text-xs font-bold tracking-[.25em] ${isBreak?'text-teal-600':'text-zinc-400'}`}>{isBreak?'휴식 중':'집중 중'}</p>
          <p className="mt-1 text-[clamp(2.7rem,14.5vw,3.9rem)] font-black leading-none tnum tracking-tight text-zinc-900">{fmt(left)}</p>
          <p className="mt-1.5 text-[11px] text-zinc-400">{isBreak?'곧 다시 시작합니다':'탭을 벗어나면 실패'}</p>
        </div>
      </div>

      {subjectEl}
      <div className="w-full space-y-2">
        {isBreak&&(
          <button onClick={useCoupon} disabled={coupons<1}
            className={`w-full rounded-xl py-3.5 text-sm font-bold transition ${coupons>0?'bg-teal-600 text-white hover:bg-teal-700':'bg-zinc-100 text-zinc-400'}`}>
            🎟️ 5분만! 쿠폰 사용하기 ({coupons}개)
          </button>
        )}
        {inFocusRun&&canReturn?(
          <div className="grid grid-cols-2 gap-2">
            <button onClick={quit} className="rounded-xl border border-zinc-300 py-3 text-sm font-semibold text-zinc-700 hover:bg-zinc-50">돌아가기 ({Math.max(0,30-runSec)}초)</button>
            <button disabled className="rounded-xl border border-zinc-100 py-3 text-sm font-semibold text-zinc-300">포기하기</button>
          </div>
        ):(
          <button onClick={()=>{if(inFocusRun){failRoutine();}else{quit();}}}
            className="w-full rounded-xl border border-zinc-200 py-3 text-sm font-semibold text-zinc-500 hover:border-zinc-400">
            {inFocusRun?'포기하기 (−10점)':'루틴 종료'}
          </button>
        )}
        {inFocusRun&&<p className="text-center text-[11px] text-zinc-400">{canReturn?'시작 30초 안에는 페널티 없이 돌아갈 수 있어요':'30초가 지났습니다. 이제 포기만 가능합니다.'}</p>}
      </div>

      {toastEl}
      {grace&&<div className="fixed left-1/2 top-4 z-40 -translate-x-1/2 rounded-full bg-amber-500 px-5 py-3 text-xs font-bold text-white shadow-lg">⚠️ 3초 유예로 살았습니다. 다음엔 실패입니다.</div>}
    </div>

    {devPanel}

    {fail&&(
      <div className="flash fixed inset-0 z-50 flex items-center justify-center px-6">
        <div className="shake w-full max-w-sm rounded-2xl bg-white p-7 text-center shadow-2xl">
          <p className="text-5xl">🚨</p>
          <h2 className="mt-4 text-2xl font-black text-red-600">딴짓 적발</h2>
          <p className="mt-3 text-sm leading-relaxed text-zinc-600">집중 타이머 도중 화면을 벗어났습니다.<br/>루틴은 <b>실패</b> 처리되었습니다.</p>
          <div className="mt-5 flex justify-center gap-6 rounded-xl bg-red-50 py-4">
            <div><p className="text-[11px] text-red-400">예상 점수</p><p className="text-2xl font-black tnum text-red-600">−10</p></div>
            <div><p className="text-[11px] text-red-400">연속 기록</p><p className="text-2xl font-black text-red-600">0</p></div>
          </div>
          <button onClick={retry} className="mt-5 w-full rounded-xl bg-red-600 py-3.5 text-sm font-bold text-white hover:bg-red-700">다시 집중한다</button>
          <button onClick={quit} className="mt-2 w-full py-2 text-xs font-semibold text-zinc-400">오늘은 여기까지</button>
        </div>
      </div>
    )}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
